name: Scheduled Pull and Diff

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Scheduled and manual runs share a database; never overlap their baselines.
concurrency:
  group: pull-and-diff
  cancel-in-progress: false

jobs:
  pull-and-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        id: prisma
        run: npm run prisma:generate
      - name: Test pipeline and diff contracts
        run: npm test
      - name: Build frontend
        run: npm --workspace=frontend run build
      - name: Run pull and diff
        run: node scripts/pull-and-diff.js
        env:
          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SERPAPI_KEY_3: ${{ secrets.SERPAPI_KEY_3 }}
          SERPAPI_KEY_4: ${{ secrets.SERPAPI_KEY_4 }}
          SERPAPI_KEY_5: ${{ secrets.SERPAPI_KEY_5 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
      - name: Report stored snapshots and diffs
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm run pipeline:status
        env:
          PIPELINE_REPORT_PATH: pipeline-status.json
      - name: Save collection evidence
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status-${{ github.run_id }}
          path: pipeline-status.json
          if-no-files-found: warn
          retention-days: 14
