name: Scheduled Pull and Diff

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      smtp_diagnostic:
        description: Check SMTP without collecting data; optionally send a test email
        type: boolean
        required: false
        default: false
      smtp_diagnostic_to:
        description: Optional recipient for one direct diagnostic email
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Scheduled and manual runs share a database; never overlap their baselines.
concurrency:
  group: pull-and-diff
  cancel-in-progress: false

jobs:
  pull-and-diff:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.smtp_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        id: prisma
        run: npm run prisma:generate
      - name: Test pipeline and diff contracts
        run: npm test
      - name: Build frontend
        run: npm --workspace=frontend run build
      - name: Run pull and diff
        run: node scripts/pull-and-diff.js
        env:
          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SERPAPI_KEY_3: ${{ secrets.SERPAPI_KEY_3 }}
          SERPAPI_KEY_4: ${{ secrets.SERPAPI_KEY_4 }}
          SERPAPI_KEY_5: ${{ secrets.SERPAPI_KEY_5 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
      - name: Report stored snapshots and diffs
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        run: npm run pipeline:status
        env:
          PIPELINE_REPORT_PATH: pipeline-status.json
      - name: Save collection evidence
        if: ${{ !cancelled() && steps.prisma.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-status-${{ github.run_id }}
          path: pipeline-status.json
          if-no-files-found: warn
          retention-days: 14

  smtp-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smtp_diagnostic }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Check SMTP transport
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          DIAGNOSTIC_TO: ${{ inputs.smtp_diagnostic_to }}
        run: |
          node --input-type=module <<'NODE'
          import nodemailer from 'nodemailer';

          const required = ['SMTP_HOST', 'SMTP_PORT', 'SMTP_USER', 'SMTP_PASS', 'ALERT_FROM'];
          if (required.some((name) => !process.env[name]?.trim())) {
            console.error('SMTP diagnostic failed: one or more required Secrets are empty.');
            process.exit(1);
          }
          const host = process.env.SMTP_HOST.toLowerCase();
          const port = Number(process.env.SMTP_PORT);
          if (!Number.isInteger(port) || port < 1 || port > 65535) {
            console.error('SMTP diagnostic failed: SMTP_PORT is invalid.');
            process.exit(1);
          }
          const provider = host.includes('mailtrap')
            ? (host.includes('sandbox') ? 'Mailtrap Sandbox (external delivery disabled)' : 'Mailtrap Sending')
            : host.includes('gmail') ? 'Gmail'
            : host.includes('ethereal') ? 'Ethereal test mailbox'
            : 'Other SMTP provider';
          console.log(`SMTP provider mode: ${provider}.`);
          const transport = nodemailer.createTransport({
            host: process.env.SMTP_HOST,
            port,
            secure: port === 465,
            requireTLS: port !== 465,
            auth: { user: process.env.SMTP_USER, pass: process.env.SMTP_PASS },
          });
          try {
            await transport.verify();
            console.log('SMTP connection and authentication succeeded.');
            const recipient = process.env.DIAGNOSTIC_TO?.trim();
            if (recipient) {
              if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(recipient)) {
                throw new Error('Invalid diagnostic recipient.');
              }
              const result = await transport.sendMail({
                from: process.env.ALERT_FROM,
                to: recipient,
                subject: `Notice Me SMTP diagnostic ${new Date().toISOString()}`,
                text: 'Direct SMTP delivery test. No new Diff was generated or marked alerted.',
              });
              const accepted = result.accepted?.some((address) => address.toLowerCase() === recipient.toLowerCase());
              if (!accepted || result.rejected?.length) throw new Error('SMTP did not accept the diagnostic recipient.');
              const secrets = required.map((name) => process.env[name]).filter(Boolean);
              const safeResponse = secrets.reduce((value, secret) => value.replaceAll(secret, '[REDACTED]'),
                String(result.response || '').replace(/[\r\n]/g, ' '));
              console.log(`SMTP accepted diagnostic recipient; message ID: ${result.messageId || 'none'}.`);
              console.log(`SMTP response: ${safeResponse || 'none'}.`);
            }
          } catch {
            console.error('SMTP verification or diagnostic send failed; check the provider settings.');
            process.exitCode = 1;
          } finally {
            transport.close();
          }
          NODE
